name: Android Release Build

on:
  # 支持在 GitHub 界面手动触发。
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码。
      - uses: actions/checkout@v4

      # 安装 Flutter SDK。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          cache: true

      # 配置 Java 17（用于 Android/Gradle）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 拉取 Dart/Flutter 依赖。
      - name: Flutter pub get
        run: flutter pub get

      # 从 base64 的 Secret 解码 Android keystore（可选）。
      # 若未配置 Secrets，将在 Gradle 中回退为 debug 签名，避免构建直接失败。
      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

          if [ -f android/app/upload-keystore.jks ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # 构建 release APK。
      - name: Build APK (release)
        run: flutter build apk --release
        env:
          # 注意：当 keystore 不可用时注入空字符串。
          # Gradle 会将空值视为未配置，并回退到 debug 签名。
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.has_keystore == 'true' && 'upload-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}

      # 构建 release AAB。
      - name: Build App Bundle (release)
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.has_keystore == 'true' && 'upload-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.has_keystore == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}

      # 上传构建产物，便于在 GitHub Actions 中下载。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
